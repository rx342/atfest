[project]
name = "atfest"
version = "0.1.0"
description = "Make a schedule"
readme = "README.md"
authors = [
    { name = "rx342", email = "15484682+rx342@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.9.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
atfest = "atfest.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
